# Databricks Asset Bundle for lakebase-solutions.
#
# DABs-first: every resource DABs can manage is expressed here (SPEC section 4).
# SDK/REST is reserved for what DABs cannot do at Public Preview / GA.
#
# Lakebase surface (SPEC section 4/8): the AUTOSCALING `postgres` projects/
# branches/endpoints tier (min/max CU + scale-to-zero) -- NOT the legacy
# provisioned `database_instance` tier (excluded: no scale-to-zero).
#   * postgres_project / postgres_endpoint -> autoscaling Lakebase
#   * secret_scope                         -> GA
#   * app                                  -> GA
#
# INTENTIONALLY NOT USED:
#   * postgres_role -- PG roles/grants are created via `CREATE ROLE` SQL over
#     psycopg in core/security, NOT via a bundle resource.
#   * database_instance (provisioned tier) -- excluded; no scale-to-zero.
#
# NOTE: The deploy notebook (deploy.py) invokes `databricks bundle deploy` from
# inside the workspace (commit -> push -> pull -> run). This file is
# `bundle validate`-clean (zero warnings); P0 does not run it.
#
# POSTGRES RESOURCE SHAPE: the `postgres_projects`/`postgres_endpoints` resources
# below use the FLAT schema the CLI expects (verified against `databricks bundle
# schema`, resources.PostgresProject / resources.PostgresEndpoint):
#   * project  -> `project_id` (required) + `display_name`
#   * endpoint -> `endpoint_id` + `parent` + `endpoint_type` (all required),
#                 plus `autoscaling_limit_{min,max}_cu` and
#                 `suspend_timeout_duration` (scale-to-zero).
# There is NO `name`/`spec` nesting -- those were the old (rejected) shape.
# SDK-fallback (`w.postgres.create_project`) is retained commented below in case
# a future CLI version drops these Beta bundle resources.

bundle:
  name: lakebase-solutions

variables:
  prefix:
    description: Deployment ID / prefix that namespaces every resource.
    default: acme-ws
  autoscaling_min_cu:
    description: Endpoint minimum compute units (0.5-32); scale-to-zero via suspend timeout.
    default: "0.5"
  autoscaling_max_cu:
    description: Endpoint maximum compute units (0.5-32).
    default: "2"
  region:
    description: Cloud region for host/endpoint patterns.
    default: us-west-2
  database:
    description: Postgres database name inside the Lakebase instance.
    default: databricks_postgres
  admin_group:
    description: Databricks group gating the admin app.
    default: acme-ws-admins
  workshop_group:
    description: Databricks group for workshop participants.
    default: acme-ws-participants
  secret_scope:
    description: Standalone Databricks secret scope for this deployment.
    default: acme-ws-secrets
  enable_data_api:
    description: Whether the Data API configure step runs (manual UI enable is still required).
    default: true

resources:
  # Lakebase AUTOSCALING `postgres` project (+ its default `production` branch
  # and `primary` read-write endpoint). The project id is the bare prefix;
  # creating the project auto-provisions the `production` branch + a `primary`
  # read-write endpoint. The endpoint resource below brings that auto-created
  # endpoint under bundle management (`replace_existing`) and carries the
  # autoscaling CU range + scale-to-zero suspend timeout.
  postgres_projects:
    lakebase:
      project_id: ${var.prefix}
      display_name: ${var.prefix} Lakebase (workshop)
  postgres_endpoints:
    primary:
      endpoint_id: primary
      # API resource hierarchy: the branch that contains this endpoint.
      parent: projects/${var.prefix}/branches/production
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: ${var.autoscaling_min_cu}
      autoscaling_limit_max_cu: ${var.autoscaling_max_cu}
      # Scale-to-zero: suspend the endpoint after this idle duration (60s-604800s).
      suspend_timeout_duration: 300s
      # Take over the primary endpoint auto-created with the production branch
      # instead of failing with ALREADY_EXISTS.
      replace_existing: true

  # SDK-FALLBACK (if the bundle cannot express the above at P1b): drop the two
  # resources and provision from core/lakebase/deploy.py instead, e.g.
  #   w.postgres.create_project(
  #       "${var.prefix}", spec={"display_name": "${var.prefix} Lakebase"})
  #   # create_project auto-creates the `production` branch + `primary` endpoint;
  #   # then w.postgres.update_endpoint(...) to set the autoscaling CU range.
  # The deploy step already resolves whatever `primary` endpoint it finds.

  # Standalone secret scope for this deployment's credentials (PG user/password,
  # Data API SP client id/secret). Never reused across apps (SPEC section 4).
  secret_scopes:
    app_secrets:
      name: ${var.secret_scope}

  # The always-on admin app (Lakebase DBA console). It is the ONLY core app;
  # each module ships its own separate Databricks App.
  # App runtime config (env vars, command) lives in core/admin_app/app.yaml.
  apps:
    admin_app:
      name: ${var.prefix}-admin-app
      description: lakebase-solutions admin console (Lakebase DBA operations).
      source_code_path: ./core/admin_app

targets:
  dev:
    default: true
    mode: development
    # workspace.profile / host is supplied by the deploy notebook's environment
    # (deploy runs inside Databricks). Left unset here for the P0 skeleton.
    variables:
      prefix: acme-ws
      autoscaling_min_cu: "0.5"
      autoscaling_max_cu: "2"
