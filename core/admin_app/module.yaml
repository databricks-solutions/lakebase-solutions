name: admin_app
version: 0.1.0
kind: core
personas: [dba, technical_leadership]
enabled_by_default: true
depends_on:
  core: [lakebase, security, user_management]
  modules: []
parameters:
  - name: admin_group
    type: string
    default: ""
    required: false
    advanced: false
    label: Admin group
    help: Databricks group gating the admin app. Blank = ${prefix}-admins.
  - name: admin_app_source_path
    type: string
    default: ""
    required: false
    advanced: true
    label: Admin app source path
    help: >-
      Workspace path of the admin app package to deploy. Blank = derived from the
      connecting identity + repo_folder (/Workspace/Users/<email>/<repo_folder>/core/admin_app).
  - name: repo_folder
    type: string
    default: lakebase-solutions
    required: false
    advanced: true
    label: Repo folder name
    help: >-
      Name of the synced Git folder under /Workspace/Users/<email>/ (used only to
      derive the admin app source path when admin_app_source_path is blank).
  - name: include_ash_collector
    type: bool
    default: true
    required: false
    advanced: true
    label: Include ASH collector job
    help: >-
      Create an always-on (continuous) Databricks job that samples pg_stat_activity
      into the console's ash_history/ash_query_log tables every ~60s with 7-day
      retention, so the live-dashboard history chart has real, gapless coverage.
      Each deployment runs its own collector against its own instance. Set false to
      disable.
provides:
  # The ONLY always-on app; each module ships its own separate Databricks App.
  app: ["${prefix}-admin-app"]
features:
  - name: Databricks Apps
    maturity: GA
    note: Hosts the Lakebase DBA console (and the Feature Maturity page).
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
