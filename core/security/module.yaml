name: security
version: 0.1.0
kind: core
personas: [dba, technical_leadership]
enabled_by_default: true
depends_on:
  core: [lakebase]
  modules: []
parameters:
  - name: secret_scope
    type: string
    default: ""
    required: false
    advanced: true
    label: Secret scope
    help: Standalone secret scope. Blank = ${prefix}-secrets. Advanced -- set in config.yaml.
  - name: admin_group
    type: string
    default: ""
    required: false
    advanced: false
    label: Admin group
    help: Databricks admin group. Blank = ${prefix}-admins.
  - name: workshop_group
    type: string
    default: ""
    required: false
    advanced: false
    label: Workshop group
    help: Databricks workshop group. Blank = ${prefix}-participants.
provides:
  # PG roles/grants are created via `CREATE ROLE` SQL over psycopg -- NOT via the
  # Beta postgres_role bundle resource (SPEC section 4).
  secret_scope: ["${prefix}-secrets"]
  pg_roles: ["${prefix}_app", "${prefix}_app_perms"]
  service_principals: ["${prefix}-app-sp"]
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
