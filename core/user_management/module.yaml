name: user_management
version: 0.1.0
kind: core
personas: [dba, technical_leadership]
enabled_by_default: true
depends_on:
  core: [lakebase, security]
  modules: []
parameters:
  - name: admin_group
    type: string
    default: ""
    required: false
    advanced: false
    label: Admin group
    help: Databricks admin group. Blank = ${prefix}-admins.
  - name: workshop_group
    type: string
    default: ""
    required: false
    advanced: false
    label: Workshop group
    help: Databricks workshop group. Blank = ${prefix}-participants.
  - name: grant_deployer_superuser
    type: bool
    default: true
    required: false
    advanced: true
    label: Grant deployer databricks_superuser
    help: >-
      Grant the deploying admin the built-in databricks_superuser PG role so the
      admin console (which connects on-behalf-of the signed-in admin) can
      read/maintain all schemas. A workspace admin has no Postgres privileges by
      default. Uncheck to opt out.
provides:
  databricks_groups: ["${prefix}-admins", "${prefix}-participants"]
  # PG workshop-user roles are created via `CREATE ROLE` SQL (not postgres_role).
  pg_roles: ["${prefix}_participant"]
features:
  - name: Databricks groups & entitlements (SCIM)
    maturity: GA
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
