name: data_api
version: 0.1.0
kind: core
personas: [app_developer, ai_engineer, dba]
enabled_by_default: true
depends_on:
  core: [lakebase, security]
  modules: []
parameters:
  - name: enable_data_api
    type: bool
    default: true
    required: false
    advanced: false
    label: Enable Data API
    help: >-
      Runs the re-runnable configure step (SP + databricks_auth role + RLS).
      The Data API UI enable is a SEPARATE, MANUAL step (see two_phase note).
provides:
  service_principals: ["${prefix}-data-api-sp"]
  pg_roles: ["databricks_auth"]
# Data API is two-phase (SPEC section 4 / section 6):
#   Phase 1 (MANUAL): a human enables the Data API in the Lakebase UI and exposes
#     the target schema. The deploy step prints a loud, explicit instruction.
#   Phase 2 (RE-RUNNABLE): this component configures the dedicated SP,
#     `databricks_auth` role registration, and RLS/schema. Safe to re-run after
#     the manual enable is done.
two_phase:
  manual_enable: "Enable the Data API in the Lakebase UI and expose the target schema."
  configure_step: "Re-run deploy after the manual enable to configure SP + role + RLS."
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
