name: lakebase
version: 0.1.0
kind: core
personas: [dba, app_developer, ai_engineer, etl_developer, technical_leadership]
# Core is always deployed; the flag documents intent and pre-selects in tooling.
enabled_by_default: true
depends_on:
  core: []
  modules: []
parameters:
  - name: capacity
    type: string
    default: CU_1
    required: false
    advanced: false
    label: Lakebase capacity (SKU)
    help: Lakebase SKU/size (autoscaling-only; capacity is the SKU, not a provisioned toggle).
  - name: node_count
    type: int
    default: 1
    required: false
    advanced: false
    label: Lakebase node count
    help: Number of Lakebase nodes.
  - name: database
    type: string
    default: databricks_postgres
    required: false
    advanced: true
    label: Postgres database name
    help: Base PG database name inside the instance. Advanced -- set in config.yaml.
provides:
  # Managed by the `database_instance` DABs resource (GA), NOT the Beta postgres surface.
  database_instance: ["${prefix}-lakebase"]
  database: ["databricks_postgres"]
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
