name: lakebase
version: 0.1.0
kind: core
personas: [dba, app_developer, ai_engineer, etl_developer, technical_leadership]
# Core is always deployed; the flag documents intent and pre-selects in tooling.
enabled_by_default: true
depends_on:
  core: []
  modules: []
parameters:
  - name: autoscaling_min_cu
    type: string
    default: "0.5"
    required: false
    advanced: false
    label: Autoscaling min CU
    help: Endpoint minimum compute units (0.5-32). Scale-to-zero via suspend timeout.
  - name: autoscaling_max_cu
    type: string
    default: "2"
    required: false
    advanced: false
    label: Autoscaling max CU
    help: Endpoint maximum compute units (0.5-32).
  - name: database
    type: string
    default: databricks_postgres
    required: false
    advanced: true
    label: Workshop Postgres database name
    help: >-
      Workshop PG database (created explicitly -- the endpoint's default
      `postgres` db has a restricted public schema). Advanced -- set in config.yaml.
provides:
  # Autoscaling `postgres` surface: project id is the bare prefix; creating it
  # auto-provisions a `production` branch + `primary` read-write endpoint.
  postgres_project: ["${prefix}"]
  postgres_endpoint: ["projects/${prefix}/branches/production/endpoints/primary"]
  database: ["databricks_postgres"]
entrypoint: deploy.py
teardown: teardown.py
health_check: health.py
